name: CI

on:
  pull_request:
    branches: [main]
  push:

env:
  # Ephemeral, CI-only credentials for the postgres service below — never a
  # real secret, scoped to this job's throwaway container only.
  PGDATABASE: cmc_ci
  PGUSER: postgres
  PGPASSWORD: postgres
  CMC_APP_PASSWORD: cmc_app_ci_password

# Least-privilege default for GITHUB_TOKEN. actions/upload-artifact@v4 uses
# the runtime artifact token, not GITHUB_TOKEN's actions scope, so no job
# needs to raise actions: write.
permissions:
  contents: read

jobs:
  # The blocking gate (docs/26 phase-02 "CI-lite"): typecheck + unit/
  # integration test suite. e2e is wired as its own non-blocking job below —
  # deliberately NOT part of this gate yet (docs/26 phase-02: "e2e vao CI o
  # PD"), so a flaky e2e run never blocks a merge before that follow-up phase
  # hardens it.
  typecheck-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmc_ci?schema=public
      APP_DATABASE_URL: postgresql://cmc_app:cmc_app_ci_password@localhost:5432/cmc_ci?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prisma migrate deploy` runs as the superuser role (DATABASE_URL) and
      # is what CREATEs the unprivileged `cmc_app` role (see the
      # p1_remediation_wave1_schema_rls migration) — it is created with no
      # password (that migration is committed to git), so every environment
      # must set one out-of-band before the app can connect as it. This is a
      # throwaway CI-only credential, not a real secret.
      - name: Run database migrations
        run: pnpm --filter @cmc/db exec prisma migrate deploy

      - name: Set cmc_app role password (CI-only, throwaway)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cmc_ci \
            -c "ALTER ROLE cmc_app WITH PASSWORD '${CMC_APP_PASSWORD}';"

      # Prisma 6 validates env("DATABASE_URL") from schema.prisma at engine
      # startup (separate from Node.js process.env). Writing prisma/.env gives
      # the engine a dotenv fallback so schema validation passes even when the
      # engine subprocess can't read the CI job-level env directly.
      - name: Write Prisma .env (CI schema validation)
        run: printf 'DATABASE_URL=%s\nAPP_DATABASE_URL=%s\n' "$DATABASE_URL" "$APP_DATABASE_URL" > packages/db/prisma/.env

      - name: Typecheck
        run: pnpm typecheck

      # Non-blocking for now, deliberately. `screen-role-matrix.json` is a
      # committed artifact regenerated from source (nav-registry.ts + the route
      # scanner) — it has already drifted once undetected (a removed nav entry
      # stayed in the committed JSON a day after `24ef2e3` removed it from
      # source), which is exactly the false-negative this step closes. `-I
      # '"generatedAt"'` ignores only the always-changing timestamp line; every
      # other field (pairs, paramRoutes, counts) is deterministic across runs.
      # Placed after Typecheck, not right after Install: the generator imports
      # @cmc/auth, whose `dist/` is gitignored and does not exist on a fresh
      # checkout — `pnpm typecheck` (turbo, `dependsOn: ["^build"]`) is what
      # builds it as a side effect, so this is the earliest point in the job
      # `dist/` is guaranteed to exist without adding a redundant explicit
      # build step. Promote to blocking (drop continue-on-error) once a few
      # weeks of runs show it only fires on genuine drift.
      - name: Screen-role matrix drift (non-blocking — see promotion note)
        continue-on-error: true
        run: |
          pnpm --filter @cmc/e2e exec tsx src/generate-screen-role-matrix.ts
          git diff -I '"generatedAt"' --exit-code apps/e2e/screen-role-matrix.json \
            || { echo "::warning::matrix drifted — run the generator and commit"; exit 1; }

      - name: Lint
        run: pnpm lint

      # Soft Ops frame adoption: bulk-enabled lists ≥5 (Option B cohesion gate).
      # Strict exit 1 when bulkListsOk fails. Script lives at scripts/check-ui-frames.mjs.
      - name: UI frame adoption (Soft Ops bulk gate)
        run: pnpm check:ui-frames && pnpm test:ui-frames

      - name: Test
        run: pnpm test

      # Non-blocking for now, deliberately. This gate fails when a procedure
      # exists that no flow in the manifest claims — a real signal, but one
      # whose false-alarm rate nobody has measured yet, and a gate that blocks
      # merges before it has earned trust is a gate someone deletes. Promote to
      # blocking (drop continue-on-error) once a few weeks of runs show it only
      # fires on genuine drift.
      - name: Acceptance report (non-blocking — see comment)
        continue-on-error: true
        run: pnpm acceptance:report

      - name: Coverage threshold — domain-payroll (≥90% lines + functions)
        run: pnpm --filter @cmc/domain-payroll run test:coverage

  # Follow-up per docs/26 phase-02: wired so it is easy to promote to a
  # blocking gate once the shared-DB e2e run has proven stable in CI.
  # `continue-on-error` keeps a flaky/slow e2e run from blocking a merge.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmc_ci?schema=public
      APP_DATABASE_URL: postgresql://cmc_app:cmc_app_ci_password@localhost:5432/cmc_ci?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @cmc/db exec prisma migrate deploy

      - name: Set cmc_app role password (CI-only, throwaway)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cmc_ci \
            -c "ALTER ROLE cmc_app WITH PASSWORD '${CMC_APP_PASSWORD}';"

      - name: Write Prisma .env (CI schema validation)
        run: printf 'DATABASE_URL=%s\nAPP_DATABASE_URL=%s\n' "$DATABASE_URL" "$APP_DATABASE_URL" > packages/db/prisma/.env

      - name: Build workspace packages (required by e2e — @cmc/db/dist must exist)
        run: pnpm build

      - name: Run e2e
        run: pnpm --filter @cmc/e2e test

  # `ui-e2e` is its own workflow (.github/workflows/ui-e2e.yml, push-only) —
  # see that file's header comment for why it cannot live as a job here.
  # ci.yml triggers on push AND pull_request; a job here guarded by
  # `if: github.event_name == 'push'` still emits a second, always-`skipped`
  # check run on the pull_request event for the same head SHA, and branch
  # protection accepts the latest run for a required check name regardless of
  # which trigger produced it — that skipped run could silently clear a red
  # push run. A separate push-only workflow file cannot produce that second run.

  # Trivy config/misconfig scan over Dockerfiles, compose files, and nginx
  # config under infra/. Deliberately narrow: dependency-CVE scanning is
  # Dependabot's job (it already reads pnpm-lock.yaml) and secret scanning is
  # GitHub push protection (already enabled), so duplicating either here only
  # adds a second noisy signal for the same finding. IaC/misconfig is the one
  # class nothing else in this repo covers. Report-only by design
  # (continue-on-error + exit-code 0): do not add this job to branch-protection
  # required checks until someone owns triaging its findings.
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy config scan (Dockerfile/compose/nginx misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: .claude,node_modules,.git
          format: table
          output: trivy-config-report.txt
          exit-code: '0'

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-config-report-${{ github.sha }}
          path: trivy-config-report.txt
          if-no-files-found: warn
