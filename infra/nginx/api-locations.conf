# API location blocks shared by both production vhosts (erp/hoc). Identical
# rate limits and proxy behavior on both domains — this file is the single
# source of truth, `include`d by infra/nginx/nginx.conf's two server blocks.

# tRPC API
location /trpc/ {
    limit_req zone=api burst=20 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Auth routes (OTP) — tighter rate-limit
location ~ ^/trpc/lmsAuth\. {
    limit_req zone=auth burst=2 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Staff email/password login: a credential-guessing surface, so it gets the
# strict OTP-grade auth zone (5r/m) instead of the looser sso zone the
# redirect-based OAuth hops below use. burst absorbs a legitimate shared-NAT
# office logging in together at opening time.
location = /auth/staff-login {
    limit_req zone=auth burst=10 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Staff SSO (Entra OAuth): /auth/login, /auth/callback, /auth/logout.
# Without this block the requests fall through to the SPA and SSO never
# reaches the API. Uses the dedicated sso zone (not the OTP auth zone) so a
# shared-NAT staff login surge is not throttled.
location /auth/ {
    limit_req zone=sso burst=20 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Azure-registered SSO callback path (ERP_SSO_REDIRECT_URI): /api/auth/sso/callback.
# Entra redirects the browser here after consent; rewrite to the API's
# /auth/callback handler, preserving ?code&state. The oauth_state cookie is
# Path=/ so it is sent to this path too.
location = /api/auth/sso/callback {
    limit_req zone=sso burst=20 nodelay;
    rewrite ^ /auth/callback break;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Health probe (smoke checks hit the stack through nginx)
location = /health {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# File upload/download
location /upload/ {
    client_max_body_size 50m;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_read_timeout 120s;
}
