# API location blocks shared by both local-sim vhosts (erp/hoc). Copied from
# the single-vhost production config so rate limits and proxy behavior match;
# only the file layout differs, because two server blocks need them twice.

# tRPC API
location /trpc/ {
    limit_req zone=api burst=20 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Auth routes (OTP) — tighter rate-limit
location ~ ^/trpc/lmsAuth\. {
    limit_req zone=auth burst=2 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Staff email/password login — credential-guessing surface, strict zone.
location = /auth/staff-login {
    limit_req zone=auth burst=10 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Staff SSO (Entra OAuth): /auth/login, /auth/callback, /auth/logout.
location /auth/ {
    limit_req zone=sso burst=20 nodelay;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Azure-registered SSO callback path (ERP_SSO_REDIRECT_URI).
location = /api/auth/sso/callback {
    limit_req zone=sso burst=20 nodelay;
    rewrite ^ /auth/callback break;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# Health probe (smoke checks hit the stack through nginx)
location = /health {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
}

# File upload/download
location /upload/ {
    client_max_body_size 50m;
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_read_timeout 120s;
}
