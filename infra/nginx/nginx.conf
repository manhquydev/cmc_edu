# nginx production config — cmcv2-prod stack.
# RT-2: strips x-dev-user / x-dev-lms-user before forwarding to API.
# RT-5: sets X-Forwarded-For so resolveIp() in context.ts picks up real client IP.
# Rate-limit zones: auth endpoints (OTP) and general API.
#
# Two-domain layout (2026-08-09): erp.clawcmc.io.vn serves admin ERP at root,
# hoc.clawcmc.io.vn serves the LMS parent/student portal at root. Both share
# the same API locations (infra/nginx/api-locations.conf) so rate limits and
# proxy behavior stay identical across domains — keep that file as the single
# source of truth for API routing, do not fork it per server block.
#
# UAT self-host topology: TLS terminates at the VPS Caddy, which reaches this
# nginx over a loopback-bound reverse SSH tunnel as plain HTTP — there is no
# public path to this host other than through that tunnel, so no local
# TLS/HSTS/redirect is needed here (see plans/260809-1145-self-host-uat-deploy).

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Recover the real client IP. Without this, $remote_addr is always this
    # container's bridge gateway (172.28.0.1 — the far end of the reverse SSH
    # tunnel), because every request arrives from that one hop regardless of
    # who made it. That silently broke three things before this was added:
    # the per-IP rate-limit zones below (one global bucket for the whole
    # internet), FacilityNetwork CIDR-based check-in verification
    # (apps/api/src/checkin/router.ts — a constant IP can match a configured
    # office CIDR and forge "verified on-site" for anyone), and TimePunch.ip
    # audit logging. Safe specifically because this nginx has exactly one
    # possible source of traffic (the tunnel) — see the topology note above.
    # NOTE: the address recovered here is still the Cloudflare edge IP, not
    # the end user's IP, until Caddy on the VPS is also configured to trust
    # Cloudflare and forward CF-Connecting-IP — see docs/runbook-deploy.md /
    # the VPS Caddyfile for that half of the fix.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Rate-limit zones (RT-6 app-level OTP cooldown exists; nginx adds HTTP layer)
    #   auth — per-user OTP abuse (LMS parent login). Tight: 5 req/min.
    #   sso  — Entra OAuth redirect flow. Each staff login = 2 hits
    #          (/auth/login + /auth/callback); many staff share one campus NAT
    #          egress IP, so this must tolerate a morning login surge. A separate
    #          zone keeps SSO from draining the OTP budget (they key on the same IP).
    #   api  — general tRPC traffic.
    # Defined once in http{} — shared across both server blocks below.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=sso:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;

    # Compress SPA assets before the laptop→VPS tunnel leg — that link runs
    # over a home upload connection, the actual bottleneck in this topology.
    # Cloudflare may also compress the client leg, but without this the full
    # uncompressed admin bundle (~4.2MB) crosses the tunnel on every cold load.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker embedded DNS: re-resolve upstream container names periodically
    # instead of caching the IP at nginx startup. Without this, nginx keeps
    # proxying to a dead container IP after `docker compose up -d --no-deps api`
    # (or any container recreate) until nginx itself restarts, causing 502s.
    resolver 127.0.0.11 valid=10s;

    # Unknown Host header (not erp.* or hoc.*) — reject rather than silently
    # falling through to one of the two SPAs below.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # ── ERP (staff) ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name erp.clawcmc.io.vn;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Deep links may carry staff UUIDs (e.g. payroll ?userId=) — keep Referer same-origin.
        add_header Referrer-Policy same-origin always;

        # RT-2: Strip impersonation headers unconditionally before forwarding.
        # These must never reach the API from an external request.
        proxy_set_header X-Dev-User        "";
        proxy_set_header X-Dev-Lms-User    "";

        # Pass real client IP to API (RT-5: resolveIp() trusts 127.0.0.1 by default,
        # set TRUSTED_PROXY_CIDRS to nginx container IP if running in Docker network).
        # X-Forwarded-Proto is fixed to https (not $scheme): Caddy is the real
        # TLS terminator and the tunnel to this host is always plain HTTP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $host;

        include /etc/nginx/api-locations.conf;

        # Admin SPA at root. The admin container's dist is built with
        # VITE_BASE=/ for this domain (asset URLs are un-prefixed), but the
        # container still serves it from /admin (spa-fallback-admin.conf) —
        # rewrite before proxying, same technique the LMS root block always used.
        location / {
            set $admin_upstream admin:80;
            rewrite ^/(.*)$ /admin/$1 break;
            proxy_pass http://$admin_upstream;
        }
    }

    # ── LMS (parent / student) ───────────────────────────────────────────────
    server {
        listen 80;
        server_name hoc.clawcmc.io.vn;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;

        proxy_set_header X-Dev-User        "";
        proxy_set_header X-Dev-Lms-User    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $host;

        include /etc/nginx/api-locations.conf;

        # LMS SPA at root — container only serves its app under /lms/*, so the
        # root-mapped URI must be rewritten before proxying.
        location / {
            set $lms_upstream lms:80;
            rewrite ^/(.*)$ /lms/$1 break;
            proxy_pass http://$lms_upstream;
        }
    }
}
