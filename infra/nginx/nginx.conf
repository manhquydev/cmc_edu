# nginx production config — cmcv2-prod stack.
# RT-2: strips x-dev-user / x-dev-lms-user before forwarding to API.
# RT-5: sets X-Forwarded-For so resolveIp() in context.ts picks up real client IP.
# Rate-limit zones: auth endpoints (OTP) and general API.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Rate-limit zones (RT-6 app-level OTP cooldown exists; nginx adds HTTP layer)
    #   auth — per-user OTP abuse (LMS parent login). Tight: 5 req/min.
    #   sso  — Entra OAuth redirect flow. Each staff login = 2 hits
    #          (/auth/login + /auth/callback); many staff share one campus NAT
    #          egress IP, so this must tolerate a morning login surge. A separate
    #          zone keeps SSO from draining the OTP budget (they key on the same IP).
    #   api  — general tRPC traffic.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=sso:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN;   # REPLACE before deploy

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # RT-2: Strip impersonation headers unconditionally before forwarding.
        # These must never reach the API from an external request.
        proxy_set_header X-Dev-User        "";
        proxy_set_header X-Dev-Lms-User    "";

        # Pass real client IP to API (RT-5: resolveIp() trusts 127.0.0.1 by default,
        # set TRUSTED_PROXY_CIDRS to nginx container IP if running in Docker network).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # tRPC API
        location /trpc/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api:3000;
        }

        # Auth routes (OTP) — tighter rate-limit
        location ~ ^/trpc/lmsAuth\. {
            limit_req zone=auth burst=2 nodelay;
            proxy_pass http://api:3000;
        }

        # Staff SSO (Entra OAuth): /auth/login, /auth/callback, /auth/logout.
        # Without this block the requests fall through to the LMS SPA and SSO
        # never reaches the API. Uses the dedicated sso zone (not the OTP auth
        # zone) so a shared-NAT staff login surge is not throttled.
        location /auth/ {
            limit_req zone=sso burst=20 nodelay;
            proxy_pass http://api:3000;
        }

        # Azure-registered SSO callback path (ERP_SSO_REDIRECT_URI):
        # /api/auth/sso/callback. Entra redirects the browser here after consent;
        # rewrite to the API's /auth/callback handler, preserving ?code&state.
        # The oauth_state cookie is Path=/ so it is sent to this path too.
        location = /api/auth/sso/callback {
            limit_req zone=sso burst=20 nodelay;
            rewrite ^ /auth/callback break;
            proxy_pass http://api:3000;
        }

        # Health probe (smoke checks hit the stack through nginx)
        location = /health {
            proxy_pass http://api:3000;
        }

        # File upload/download
        location /upload/ {
            client_max_body_size 50m;
            proxy_pass http://api:3000;
            proxy_read_timeout 120s;
        }

        # Admin SPA — served from admin container static files via internal proxy
        location /admin/ {
            proxy_pass http://admin:80/admin/;
        }

        # LMS SPA (parent portal) — root
        location / {
            proxy_pass http://lms:80/lms/;
        }
    }
}
