# nginx config for the LOCAL-SIM stack (docker-compose.prod.yml +
# infra/compose.local-sim.yml). Derived from nginx.conf; the proxy, rate-limit,
# header-stripping and TLS semantics are the production ones so what a tester
# exercises here is what production does.
#
# Four deliberate differences from nginx.conf, all local-only:
#
#   1. Two vhosts instead of one. .env.prod already names two origins
#      (erp.* and hoc.*); this config makes that split explicit locally as
#      erp.localhost and hoc.localhost, both resolving to loopback with no
#      /etc/hosts edit. Each SPA therefore owns its origin root.
#   2. Each vhost rewrites the request into its container's sub-directory
#      (/admin or /lms). The SPA images publish their bundles under those
#      paths while the built HTML references assets at the origin root
#      (/assets/...), so the rewrite is what makes asset URLs resolve. The
#      single-vhost `location /admin/` layout in nginx.conf cannot do this:
#      /assets/* falls through to the LMS container and returns index.html
#      with a text/html content type, which browsers refuse to execute.
#   3. No Strict-Transport-Security. HSTS is stored per host, so issuing it for
#      *.localhost would force https on every other localhost app on the
#      machine for the max-age window.
#   4. auth zone 5r/m -> 30r/m. Signing in as several demo roles in a row is a
#      normal test session; the production rate stays in nginx.conf.
#
# TLS uses a self-signed cert covering erp.localhost, hoc.localhost and
# localhost — see infra/compose.local-sim.yml for the openssl command.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=sso:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;

    resolver 127.0.0.11 valid=10s;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── ERP (staff) ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name erp.localhost;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_set_header X-Dev-User        "";
        proxy_set_header X-Dev-Lms-User    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        include /etc/nginx/local-sim-api-locations.conf;

        location / {
            set $admin_upstream admin:80;
            rewrite ^/(.*)$ /admin/$1 break;
            proxy_pass http://$admin_upstream;
        }
    }

    # ── LMS (parent / student) ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name hoc.localhost localhost;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_set_header X-Dev-User        "";
        proxy_set_header X-Dev-Lms-User    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        include /etc/nginx/local-sim-api-locations.conf;

        location / {
            set $lms_upstream lms:80;
            rewrite ^/(.*)$ /lms/$1 break;
            proxy_pass http://$lms_upstream;
        }
    }
}
