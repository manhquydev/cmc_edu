# Admin SPA under /admin/ — edge nginx proxies full /admin/* URI into this
# container, so try_files must fall back to /admin/index.html (not /index.html).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Health for docker (optional)
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
