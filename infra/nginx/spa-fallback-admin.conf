# SPA fallback for the admin container in the local-sim stack.
#
# The image copies the bundle to /usr/share/nginx/html/admin, but the shared
# spa-fallback.conf falls back to /index.html at the server root — which does
# not exist there, so nginx serves its own welcome page instead. Any deep link
# or page refresh (/finance, /crm, ...) therefore leaves the app. Falling back
# to /admin/index.html is what makes client-side routing survive a reload.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /admin/index.html;
    }
}
