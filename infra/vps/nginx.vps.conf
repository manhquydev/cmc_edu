# CMC EDU — VPS nginx (152.42.167.189) — serves deverp.cmcvn.edu.vn (admin)
# and devlms.cmcvn.edu.vn (LMS) on 8080 ssl. Co-located with cmc-lms on 80/443.
# Boundary: AOP (ssl_verify_client) + allow-only-Cloudflare + default 444.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    # Rate-limit zones (shared by both vhosts via api-locations.conf)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=sso:10m  rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_zone $binary_remote_addr zone=clienterr:10m rate=10r/m;
    limit_req_status 429;

    # Real client IP: traffic arrives from Cloudflare edge only. Trust CF v4+v6
    # ranges (kept current; see cloudflare.com/ips-v4|v6) + CF-Connecting-IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Shared API location blocks (single source of truth — includes /trpc,
    # /auth, /health, /upload/, /api/track-error with clienterr zone).

    # ── deverp.cmcvn.edu.vn — Admin ERP at root ────────────────────────────────
    server {
        listen 8080 ssl;
        server_name deverp.cmcvn.edu.vn;

        # Authenticated Origin Pulls: only Cloudflare (presenting its client
        # cert) can reach the origin; everything else gets 400.
        ssl_verify_client on;
        ssl_client_certificate /etc/nginx/cf-origin-pull-ca.pem;

        ssl_certificate     /etc/letsencrypt/live/deverp.cmcvn.edu.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deverp.cmcvn.edu.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Boundary: allow only Cloudflare v4+v6 ranges (direct-to-IP gets 444).
        allow 173.245.48.0/20; allow 103.21.244.0/22; allow 103.22.200.0/22; allow 103.31.4.0/22;
        allow 141.101.64.0/18; allow 108.162.192.0/18; allow 190.93.240.0/20; allow 188.114.96.0/20;
        allow 197.234.240.0/22; allow 198.41.128.0/17; allow 162.158.0.0/15; allow 104.16.0.0/13;
        allow 104.24.0.0/14; allow 172.64.0.0/13; allow 131.0.72.0/22;
        allow 2400:cb00::/32; allow 2606:4700::/32; allow 2803:f800::/32; allow 2405:b500::/32;
        allow 2405:8100::/32; allow 2a06:98c0::/29; allow 2c0f:f248::/32;
        deny all;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        set $admin_upstream admin:80;
        include /etc/nginx/api-locations.conf;

        location / {
            rewrite ^/(.*)$ /admin/$1 break;
            proxy_pass http://$admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── devlms.cmcvn.edu.vn — LMS portal at root ───────────────────────────────
    server {
        listen 8080 ssl;
        server_name devlms.cmcvn.edu.vn;

        ssl_verify_client on;
        ssl_client_certificate /etc/nginx/cf-origin-pull-ca.pem;

        ssl_certificate     /etc/letsencrypt/live/devlms.cmcvn.edu.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devlms.cmcvn.edu.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        allow 173.245.48.0/20; allow 103.21.244.0/22; allow 103.22.200.0/22; allow 103.31.4.0/22;
        allow 141.101.64.0/18; allow 108.162.192.0/18; allow 190.93.240.0/20; allow 188.114.96.0/20;
        allow 197.234.240.0/22; allow 198.41.128.0/17; allow 162.158.0.0/15; allow 104.16.0.0/13;
        allow 104.24.0.0/14; allow 172.64.0.0/13; allow 131.0.72.0/22;
        allow 2400:cb00::/32; allow 2606:4700::/32; allow 2803:f800::/32; allow 2405:b500::/32;
        allow 2405:8100::/32; allow 2a06:98c0::/29; allow 2c0f:f248::/32;
        deny all;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        set $lms_upstream lms:80;
        include /etc/nginx/api-locations.conf;

        location / {
            rewrite ^/(.*)$ /lms/$1 break;
            proxy_pass http://$lms_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Reject unknown Hosts outright.
    server {
        listen 8080 ssl default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/deverp.cmcvn.edu.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deverp.cmcvn.edu.vn/privkey.pem;
        return 444;
    }
}